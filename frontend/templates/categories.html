{% extends "base.html" %}

{% block title %}Categories - Global News Aggregator{% endblock %}

{% block content %}
<div class="page-wrapper">
  <h1>Categories</h1>
  <div class="grid-auto">
    {% for item in category_counts %}
    <a href="/categories/{{ item.category.slug }}" class="card" style="text-decoration: none;">
      <div class="card-body">
        <h3 style="margin-bottom: 0.5rem;">{{ item.category.name }}</h3>
        <span class="badge badge-accent">{{ item.count }} articles</span>
      </div>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
