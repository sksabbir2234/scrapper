{% extends "base.html" %}

{% block title %}Tags - Global News Aggregator{% endblock %}

{% block content %}
<div class="page-wrapper">
  <div class="content-wrap">
    <h1>Tags</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">{{ tags|length }} tags</p>

    <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
      {% for item in tags %}
      <a href="/tags/{{ item.tag.slug }}" class="tag-pill">
        {{ item.tag.name }}
        <span class="badge badge-neutral" style="margin-left: 4px;">{{ item.count }}</span>
      </a>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
